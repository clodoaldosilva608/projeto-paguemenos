name: CI

on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:
    branches: [main]

# Cancelar runs anteriores da mesma branch quando novo push chega
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true # Lint não bloqueia PR (apenas avisa) — muitos warnings pré-existentes

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npx tsc --noEmit --skipLibCheck
        continue-on-error: true # TypeScript não bloqueia PR (erros pré-existentes)

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test
        env:
          CI: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build with NITRO_PRESET=vercel
        run: NITRO_PRESET=vercel npx vite build
        env:
          NITRO_PRESET: vercel

      - name: Check bundle size
        run: |
          echo "=== Bundle size check ==="
          BUNDLE_SIZE=$(du -sh .vercel/output/functions/__server.func/ | cut -f1)
          echo "Server function bundle: $BUNDLE_SIZE"

          # Listar maiores chunks
          echo ""
          echo "=== Top 10 maiores chunks ==="
          find .vercel/output/functions/__server.func/ -name "*.mjs" -exec ls -lh {} \; | sort -k5 -hr | head -10

  e2e:
    name: E2E Tests (smoke)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        env:
          CI: true

      - name: Run Playwright smoke tests (security only)
        run: npx playwright test e2e/security.spec.ts --project=desktop
        env:
          BASE_URL: https://orion-vendas.vercel.app
          CI: true

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
